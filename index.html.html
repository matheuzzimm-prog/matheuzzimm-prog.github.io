<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diamb - Cookies & Brownies Artesanais</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Work+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --purple: #7C3AED;
            --purple-dark: #5B21B6;
            --yellow: #FBBF24;
            --yellow-dark: #F59E0B;
            --bg: #FAFAFA;
            --text: #1F2937;
            --text-light: #6B7280;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Work Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }
        
        /* Header */
        header {
            padding: 3rem 0 1rem;
            border-bottom: 1px solid #E5E7EB;
        }
        
        .brand {
            font-family: 'DM Serif Display', serif;
            font-size: 2.5rem;
            color: var(--purple);
            letter-spacing: -0.02em;
        }
        
        .tagline {
            font-size: 0.875rem;
            color: var(--text-light);
            font-weight: 300;
            margin-top: 0.25rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        
        /* Hero */
        .hero {
            padding: 4rem 0 3rem;
            text-align: center;
        }
        
        .hero h1 {
            font-family: 'DM Serif Display', serif;
            font-size: 3rem;
            line-height: 1.1;
            color: var(--text);
            margin-bottom: 1rem;
        }
        
        .hero p {
            font-size: 1.125rem;
            color: var(--text-light);
            font-weight: 300;
        }
        
        /* Products Grid */
        .products {
            padding: 3rem 0 5rem;
        }
        
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            margin-top: 3rem;
        }
        
        .product-card {
            background: white;
            border: 1px solid #E5E7EB;
            padding: 2rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            cursor: pointer;
        }
        
        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(124, 58, 237, 0.12);
            border-color: var(--purple);
        }
        
        .product-image {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, var(--purple) 0%, var(--yellow) 100%);
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            opacity: 0.15;
            transition: opacity 0.3s;
        }
        
        .product-card:hover .product-image {
            opacity: 0.25;
        }
        
        .product-name {
            font-family: 'DM Serif Display', serif;
            font-size: 1.5rem;
            color: var(--text);
            margin-bottom: 0.5rem;
        }
        
        .product-price {
            font-size: 1.25rem;
            color: var(--purple);
            font-weight: 500;
            margin-bottom: 1.5rem;
        }
        
        .btn {
            width: 100%;
            padding: 0.875rem 1.5rem;
            border: none;
            background: var(--purple);
            color: white;
            font-family: 'Work Sans', sans-serif;
            font-size: 0.875rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn:hover {
            background: var(--purple-dark);
        }
        
        .btn:active {
            transform: scale(0.98);
        }
        
        /* Cart Float */
        .cart-float {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--yellow);
            color: var(--text);
            padding: 1rem 1.5rem;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 100;
        }
        
        .cart-float:hover {
            background: var(--yellow-dark);
            transform: scale(1.05);
        }
        
        .cart-count {
            background: var(--purple);
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.875rem;
            font-weight: 500;
        }
        
        .cart-total {
            font-weight: 500;
            font-size: 1.125rem;
        }
        
        /* Cart Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: white;
            width: 90%;
            max-width: 500px;
            padding: 2rem;
            max-height: 80vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #E5E7EB;
        }
        
        .modal-title {
            font-family: 'DM Serif Display', serif;
            font-size: 1.75rem;
            color: var(--purple);
        }
        
        .close-modal {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-light);
            padding: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0;
            border-bottom: 1px solid #F3F4F6;
        }
        
        .item-info {
            flex: 1;
        }
        
        .item-name {
            font-weight: 500;
            color: var(--text);
            margin-bottom: 0.25rem;
        }
        
        .item-price {
            color: var(--text-light);
            font-size: 0.875rem;
        }
        
        .item-controls {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        
        .qty-btn {
            background: var(--purple);
            color: white;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        
        .qty-btn:hover {
            background: var(--purple-dark);
        }
        
        .qty {
            font-weight: 500;
            min-width: 20px;
            text-align: center;
        }
        
        .cart-summary {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 2px solid var(--purple);
        }
        
        .cart-total-line {
            display: flex;
            justify-content: space-between;
            font-size: 1.5rem;
            font-weight: 500;
            color: var(--purple);
            margin-bottom: 1.5rem;
        }
        
        .btn-whatsapp {
            background: var(--yellow);
            color: var(--text);
            width: 100%;
            padding: 1rem;
            font-size: 1rem;
        }
        
        .btn-whatsapp:hover {
            background: var(--yellow-dark);
        }
        
        .empty-cart {
            text-align: center;
            padding: 3rem 0;
            color: var(--text-light);
        }
        
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2rem;
            }
            
            .brand {
                font-size: 2rem;
            }
            
            .products-grid {
                grid-template-columns: 1fr;
            }
            
            .cart-float {
                bottom: 1rem;
                right: 1rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="brand">Diamb</div>
            <div class="tagline">Cookies & Brownies Artesanais</div>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="container">
                <h1>Feitos com carinho,<br>prontos para você.</h1>
                <p>Escolha seus favoritos e receba em casa</p>
            </div>
        </section>

        <section class="products">
            <div class="container">
                <div class="products-grid">
                    <div class="product-card" data-id="1" data-name="Cookies Recheados" data-price="28.00">
                        <div class="product-image">🍪</div>
                        <div class="product-name">Cookies Recheados</div>
                        <div class="product-price">R$ 28,00</div>
                        <button class="btn add-to-cart">Adicionar</button>
                    </div>

                    <div class="product-card" data-id="2" data-name="Cookie Gotas" data-price="18.00">
                        <div class="product-image">🍪</div>
                        <div class="product-name">Cookie Gotas</div>
                        <div class="product-price">R$ 18,00</div>
                        <button class="btn add-to-cart">Adicionar</button>
                    </div>

                    <div class="product-card" data-id="3" data-name="Brownie" data-price="28.00">
                        <div class="product-image">🍫</div>
                        <div class="product-name">Brownie</div>
                        <div class="product-price">R$ 28,00</div>
                        <button class="btn add-to-cart">Adicionar</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Cart Float Button -->
    <div class="cart-float" id="cartFloat" style="display: none;">
        <div class="cart-count" id="cartCount">0</div>
        <div class="cart-total" id="cartFloatTotal">R$ 0,00</div>
    </div>

    <!-- Cart Modal -->
    <div class="modal" id="cartModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Seu Pedido</h2>
                <button class="close-modal" id="closeModal">✕</button>
            </div>
            
            <div id="cartItems"></div>
            
            <div class="cart-summary" id="cartSummary" style="display: none;">
                <div class="cart-total-line">
                    <span>Total</span>
                    <span id="cartModalTotal">R$ 0,00</span>
                </div>
                <button class="btn btn-whatsapp" id="finishOrder">Finalizar no WhatsApp</button>
            </div>
            
            <div class="empty-cart" id="emptyCart">
                Seu carrinho está vazio
            </div>
        </div>
    </div>

    <script>
        let cart = [];

        // Add to cart
        document.querySelectorAll('.add-to-cart').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const card = e.target.closest('.product-card');
                const product = {
                    id: card.dataset.id,
                    name: card.dataset.name,
                    price: parseFloat(card.dataset.price)
                };

                const existing = cart.find(item => item.id === product.id);
                if (existing) {
                    existing.qty++;
                } else {
                    cart.push({ ...product, qty: 1 });
                }

                updateCart();
            });
        });

        // Update cart display
        function updateCart() {
            const count = cart.reduce((sum, item) => sum + item.qty, 0);
            const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            document.getElementById('cartCount').textContent = count;
            document.getElementById('cartFloatTotal').textContent = formatMoney(total);
            document.getElementById('cartModalTotal').textContent = formatMoney(total);

            if (count > 0) {
                document.getElementById('cartFloat').style.display = 'flex';
                document.getElementById('emptyCart').style.display = 'none';
                document.getElementById('cartSummary').style.display = 'block';
            } else {
                document.getElementById('cartFloat').style.display = 'none';
                document.getElementById('emptyCart').style.display = 'block';
                document.getElementById('cartSummary').style.display = 'none';
            }

            renderCartItems();
        }

        // Render cart items
        function renderCartItems() {
            const container = document.getElementById('cartItems');
            container.innerHTML = cart.map(item => `
                <div class="cart-item">
                    <div class="item-info">
                        <div class="item-name">${item.name}</div>
                        <div class="item-price">${formatMoney(item.price)} cada</div>
                    </div>
                    <div class="item-controls">
                        <button class="qty-btn" onclick="changeQty('${item.id}', -1)">−</button>
                        <span class="qty">${item.qty}</span>
                        <button class="qty-btn" onclick="changeQty('${item.id}', 1)">+</button>
                    </div>
                </div>
            `).join('');
        }

        // Change quantity
        function changeQty(id, change) {
            const item = cart.find(i => i.id === id);
            if (item) {
                item.qty += change;
                if (item.qty <= 0) {
                    cart = cart.filter(i => i.id !== id);
                }
                updateCart();
            }
        }

        // Format money
        function formatMoney(value) {
            return `R$ ${value.toFixed(2).replace('.', ',')}`;
        }

        // Modal controls
        document.getElementById('cartFloat').addEventListener('click', () => {
            document.getElementById('cartModal').classList.add('active');
        });

        document.getElementById('closeModal').addEventListener('click', () => {
            document.getElementById('cartModal').classList.remove('active');
        });

        document.getElementById('cartModal').addEventListener('click', (e) => {
            if (e.target.id === 'cartModal') {
                document.getElementById('cartModal').classList.remove('active');
            }
        });

        // Finish order
        document.getElementById('finishOrder').addEventListener('click', () => {
            const items = cart.map(item => 
                `- ${item.qty}x ${item.name} (${formatMoney(item.price * item.qty)})`
            ).join('\n');
            
            const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            
            const message = `Olá! Quero fazer este pedido:\n\n${items}\n\n*Total: ${formatMoney(total)}*`;
            
            const phone = '5531997238739'; // Substitua pelo número real
            const url = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
            
            window.open(url, '_blank');
        });
    </script>
</body>
</html>
